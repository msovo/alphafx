[theme]
base = "dark"
primaryColor = "#00d4aa"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1d24"
textColor = "#e6e9ef"
font = "sans serif"

[server]
headless = true
runOnSave = true
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
